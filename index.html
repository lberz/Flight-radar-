<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a1a">
  <title>Leo's Flight Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0a0a1a; font-family: -apple-system, system-ui, sans-serif; }
    #map { width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: rgba(10,10,26,0.88); color: #8cf;
      padding: 10px 14px; border-radius: 12px;
      font-size: 13px; backdrop-filter: blur(8px);
      border: 1px solid rgba(100,180,255,0.25);
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    #hud b { color: #fff; }
    /* Transparent host so only the SVG plane shows */
    .plane-marker {
      background: transparent !important;
      border: none !important;
    }
    .plane-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Nose-up SVG; rotate() is applied so 0° = north / track heading */
      transform-origin: center center;
      transition: transform 0.35s ease-out;
      will-change: transform;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.65));
    }
    .plane-icon svg {
      display: block;
      width: 30px;
      height: 30px;
      overflow: visible;
    }
    .plane-icon.plane-high {
      filter:
        drop-shadow(0 0 0.6px #fff)
        drop-shadow(0 0 1.2px #fff)
        drop-shadow(0 1px 2px rgba(0,0,0,0.55));
    }
    .leaflet-popup-content-wrapper {
      background: #0f172a; color: #e5e7eb; border-radius: 12px;
      border: 1px solid rgba(100,180,255,0.28);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
    .leaflet-popup-tip { background: #0f172a; }
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.4; }
    .leaflet-popup-close-button { color: #8cf !important; top: 6px !important; right: 8px !important; }
    .leaflet-control-zoom { border: none !important; }
    .leaflet-control-zoom a {
      background: rgba(10,10,26,0.9) !important; color: #8cf !important;
      border: 1px solid rgba(100,180,255,0.3) !important;
    }

    /* Aircraft popup layout */
    .ac-popup { min-width: 210px; max-width: 270px; }
    .ac-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 10px; padding-right: 14px; margin-bottom: 2px;
    }
    .ac-cs {
      font-size: 16px; font-weight: 700; color: #fff;
      letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
    }
    .ac-type {
      font-size: 11px; color: #7dd3fc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }
    .ac-sub { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
    .ac-route {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(100, 180, 255, 0.22);
      border-radius: 9px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .ac-route-pending { font-size: 12px; color: #64748b; font-style: italic; }
    .ac-legs {
      display: grid;
      grid-template-columns: 1fr 18px 1fr;
      gap: 4px 6px;
      align-items: start;
    }
    .ac-leg-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #64748b; margin-bottom: 3px;
    }
    .ac-leg-main {
      font-size: 15px; font-weight: 700; color: #f8fafc;
      font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
      line-height: 1.15;
    }
    .ac-leg-from .ac-leg-main { color: #c4b5fd; }
    .ac-leg-to .ac-leg-main { color: #7dd3fc; }
    .ac-leg-sub {
      font-size: 11px; color: #94a3b8; margin-top: 3px; line-height: 1.3;
      word-break: break-word;
    }
    .ac-leg-arrow {
      color: #38bdf8; font-size: 15px; font-weight: 600;
      text-align: center; padding-top: 18px; line-height: 1;
    }
    .ac-route-note {
      margin-top: 8px; font-size: 10px; color: #64748b; line-height: 1.3;
    }
    .ac-links {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 10px;
    }
    .ac-link {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      color: #0f172a !important;
      background: #7dd3fc;
      text-decoration: none !important;
      padding: 5px 9px; border-radius: 999px;
      pointer-events: auto;
    }
    .ac-link:hover { background: #bae6fd; }
    .ac-grid {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 4px 10px;
      font-size: 12px;
    }
    .ac-grid .k { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 1px; }
    .ac-grid .v { color: #e2e8f0; font-variant-numeric: tabular-nums; }
    .ac-grid .v .dim { color: #94a3b8; font-size: 11px; margin-left: 4px; }
    .ac-vr-up { color: #4ade80; }
    .ac-vr-dn { color: #fb923c; }
    .ac-foot {
      margin-top: 10px; padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      font-size: 11px; color: #64748b;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span>✈ <b id="count">—</b></span>
    <span id="status">Loading…</span>
  </div>
  <div id="map"></div>

  <script>
    // ===== CONFIG =====
    const HOME = { lat: 47.6062, lon: -122.3321 };   // Seattle
    const RADIUS_NM = 100;
    const REFRESH_MS = 5000;        // Poll every 5s (was 8s)
    const ANIMATION_MS = 1200;      // Blend duration when a new API fix arrives
    // Dead-reckon between polls using ground speed + track so icons keep moving
    // Optional CORS proxy for OpenSky live airports, e.g. a Cloudflare Worker that
    // fetches the URL and returns JSON with Access-Control-Allow-Origin: *.
    // Leave empty to try direct + public relays; Google/FlightAware links always work.
    const OPENSKY_PROXY = '';       // e.g. 'https://YOUR_SUBDOMAIN.workers.dev/?url='

    // ===== MAP =====
    const map = L.map('map', {
      center: [HOME.lat, HOME.lon],
      zoom: 9,
      zoomControl: false,
      attributionControl: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO | Data: airplanes.live',
      maxZoom: 18
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.circleMarker([HOME.lat, HOME.lon], {
      radius: 6, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.8, weight: 2
    }).addTo(map).bindPopup('Home (Seattle)');

    // ===== STATE =====
    // id → { marker, lat, lon, track, alt, gs, fixLat, fixLon, fixTime,
    //         startLat, startLon, targetLat, targetLon, animStart }
    const aircraft = {};

    // Nose points UP (north) at 0°. CSS rotate(track) matches ADS-B track.
    // Colors: gray = ground, green = airborne, green + white outline = above 8000 ft.
    function planeVisualStyle(alt) {
      const onGround = alt === 'ground' || alt === 0 || alt === '0';
      const altNum = (typeof alt === 'number' && isFinite(alt)) ? alt : null;
      if (onGround || (altNum != null && altNum < 50)) {
        return { color: '#9ca3af', high: false }; // gray — on the ground
      }
      if (altNum != null && altNum > 8000) {
        return { color: '#22c55e', high: true };  // green + white outline
      }
      // Airborne (including unknown numeric alt treated as in air if not ground)
      return { color: '#22c55e', high: false };
    }

    // Top-down airliner silhouette (nose up)
    function planeSvgHtml(color, high) {
      const stroke = high
        ? 'stroke="#ffffff" stroke-width="1.35" stroke-linejoin="round" paint-order="stroke fill"'
        : 'stroke="rgba(0,0,0,0.35)" stroke-width="0.4" stroke-linejoin="round"';
      // Fuselage + wings + tailplane — reads as a plane, not a star
      return `<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path fill="${color}" ${stroke} d="
          M16 2.2
          C16.9 2.2 17.5 3.1 17.45 4.1
          L17.15 10.2
          L27.5 14.1
          C28.2 14.35 28.2 15.35 27.5 15.55
          L17.2 18.2
          L16.85 24.6
          L20.4 27.1
          C20.9 27.45 20.7 28.3 20.1 28.3
          L16 26.9
          L11.9 28.3
          C11.3 28.3 11.1 27.45 11.6 27.1
          L15.15 24.6
          L14.8 18.2
          L4.5 15.55
          C3.8 15.35 3.8 14.35 4.5 14.1
          L14.85 10.2
          L14.55 4.1
          C14.5 3.1 15.1 2.2 16 2.2
          Z"/>
      </svg>`;
    }

    function planeIcon(track, alt) {
      const { color, high } = planeVisualStyle(alt);
      const heading = (track != null && isFinite(track)) ? track : 0;
      const cls = high ? 'plane-icon plane-high' : 'plane-icon';
      return L.divIcon({
        className: 'plane-marker',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        html: `<div class="${cls}" style="transform:rotate(${heading}deg)">${planeSvgHtml(color, high)}</div>`
      });
    }

    // Geographic bearing (deg clockwise from north) from point A → B
    function bearingDeg(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // Prefer ADS-B track; if missing, infer from movement so the nose still leads
    function resolveHeading(ac, fromLat, fromLon, toLat, toLon, fallback) {
      if (ac.track != null && isFinite(ac.track)) return ac.track;
      if (
        fromLat != null && fromLon != null && toLat != null && toLon != null &&
        (Math.abs(toLat - fromLat) > 1e-7 || Math.abs(toLon - fromLon) > 1e-7)
      ) {
        return bearingDeg(fromLat, fromLon, toLat, toLon);
      }
      return (fallback != null && isFinite(fallback)) ? fallback : 0;
    }

    // Update heading / altitude styling; rebuild icon when band changes (outline needs SVG)
    function applyPlaneVisual(plane, heading, alt) {
      const prevHigh = plane._high;
      const prevGround = plane._ground;
      const { high } = planeVisualStyle(alt);
      const onGround = alt === 'ground' || alt === 0 || alt === '0' ||
        (typeof alt === 'number' && isFinite(alt) && alt < 50);
      plane.track = heading;
      plane.alt = alt;
      plane._high = high;
      plane._ground = onGround;

      // Outline / ground vs air needs SVG path attributes — rebuild when band flips
      if (prevHigh !== high || prevGround !== onGround || !plane.marker.getElement()) {
        plane.marker.setIcon(planeIcon(heading, alt));
        return;
      }
      const el = plane.marker.getElement()?.querySelector('.plane-icon');
      if (el) {
        el.style.transform = `rotate(${heading}deg)`;
      } else {
        plane.marker.setIcon(planeIcon(heading, alt));
      }
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function compass16(deg) {
      if (deg == null || !isFinite(deg)) return null;
      const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
      return dirs[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
    }

    // ===== ROUTE (accuracy-first) =====
    // Problem: free callsign "schedule" DBs invent typical routes that often don't
    // match the live flight (wrong vs Google / FlightAware). Geometry guesses are
    // also frequently wrong at cruise.
    //
    // Approach:
    //  1) On popup open only, query OpenSky Network for THIS airframe's live flight
    //     (estDepartureAirport / estArrivalAirport from real track history).
    //  2) OpenSky blocks browser CORS from arbitrary origins — try a couple of
    //     public GET proxies, then direct (works if CORS ever allows / local proxy).
    //  3) Never show a guessed airport. If we don't know, say so and offer one-click
    //     Google + FlightAware links (same places you'd double-check by hand).

    function callsignKey(ac) {
      return (ac.flight || '').trim().toUpperCase();
    }

    // ICAO airline → IATA (for nicer Google queries). Incomplete on purpose.
    const ICAO_TO_IATA = {
      ASA:'AS', UAL:'UA', AAL:'AA', DAL:'DL', SWA:'WN', JBU:'B6', NKS:'NK', FFT:'F9',
      SCX:'SY', SKW:'OO', QXE:'QX', HAL:'HA', CPA:'CX', ANZ:'NZ', BAW:'BA', AFR:'AF',
      DLH:'LH', UAE:'EK', QTR:'QR', SIA:'SQ', KAL:'KE', AAR:'OZ', JAL:'JL', ANA:'NH',
      ACA:'AC', WJA:'WS', JZA:'QK', ENY:'MQ', RPA:'YX', PDT:'PT', GJS:'G7', ASH:'YV',
      FFT:'F9', VRD:'VX', AAY:'G4', JIA:'OH', EDV:'9E', GTI:'5Y', CLX:'CV', BOX:'3S',
      FDX:'FX', UPS:'5X', GTI:'5Y', CKS:'K4', ABX:'GB', ATN:'8C', CFG:'DE', TOM:'BY',
      ICE:'FI', FIN:'AY', SAS:'SK', IBE:'IB', VLG:'VY', RYR:'FR', EZY:'U2', BAW:'BA',
      QFA:'QF', VOZ:'VA', JST:'JQ', CES:'MU', CCA:'CA', CSN:'CZ', CXA:'MF', CAL:'CI',
      EVA:'BR', THA:'TG', MAS:'MH', PAL:'PR', SWR:'LX', AUA:'OS', TAP:'TP', AZA:'AZ',
      ITY:'AZ', VIR:'VS', EIN:'EI', AEA:'UX', RAM:'AT', ETH:'ET', SAA:'SA', KQA:'KQ',
      AMX:'AM', VOI:'Y4', TAO:'VW', AIJ:'4O', WJA:'WS', TSC:'TS', FLE:'F8', ROU:'RV'
    };

    function iataFlightNumber(callsign) {
      const cs = (callsign || '').trim().toUpperCase().replace(/\s+/g, '');
      if (!cs) return '';
      // Already looks like IATA (2 letters + digits), e.g. AS667
      if (/^[A-Z]{2}\d{1,4}[A-Z]?$/.test(cs)) return cs;
      // ICAO airline (3 letters) + flight number
      const m = cs.match(/^([A-Z]{3})(\d{1,4}[A-Z]?)$/);
      if (m && ICAO_TO_IATA[m[1]]) return ICAO_TO_IATA[m[1]] + m[2];
      return cs;
    }

    // Keep a modest airport dictionary ONLY to pretty-print ICAO codes from OpenSky
    const AIRPORTS = [

      { icao:'MMUN', iata:'CUN', city:'Cancún', name:'Cancún Intl' },
      { icao:'MMSD', iata:'SJD', city:'San José del Cabo', name:'Los Cabos Intl' },
      { icao:'MMPR', iata:'PVR', city:'Puerto Vallarta', name:'Puerto Vallarta Intl' },
      { icao:'RJTT', iata:'HND', city:'Tokyo', name:'Tokyo Haneda' },
      { icao:'RJAA', iata:'NRT', city:'Tokyo', name:'Narita Intl' },
      { icao:'RKSI', iata:'ICN', city:'Seoul', name:'Incheon Intl' },
      { icao:'VHHH', iata:'HKG', city:'Hong Kong', name:'Hong Kong Intl' },
      { icao:'RCTP', iata:'TPE', city:'Taipei', name:'Taiwan Taoyuan Intl' },
      { icao:'ZSPD', iata:'PVG', city:'Shanghai', name:'Shanghai Pudong Intl' },
      { icao:'ZBAA', iata:'PEK', city:'Beijing', name:'Beijing Capital Intl' },
      { icao:'WSSS', iata:'SIN', city:'Singapore', name:'Singapore Changi' },
      { icao:'EGLL', iata:'LHR', city:'London', name:'London Heathrow' },
      { icao:'EHAM', iata:'AMS', city:'Amsterdam', name:'Amsterdam Schiphol' },
      { icao:'EDDF', iata:'FRA', city:'Frankfurt', name:'Frankfurt am Main' },
      { icao:'LFPG', iata:'CDG', city:'Paris', name:'Charles de Gaulle' },
      { icao:'LTFM', iata:'IST', city:'Istanbul', name:'Istanbul Airport' },
      { icao:'OMDB', iata:'DXB', city:'Dubai', name:'Dubai Intl' },
      { icao:'YSSY', iata:'SYD', city:'Sydney', name:'Sydney Kingsford Smith' },
      { icao:'YMML', iata:'MEL', city:'Melbourne', name:'Melbourne Intl' },
      { icao:'NZAA', iata:'AKL', city:'Auckland', name:'Auckland Intl' }
    ];
    const AIRPORT_BY_ICAO = new Map(AIRPORTS.map(a => [a.icao, a]));

    function lookupAirport(code) {
      if (!code) return null;
      const c = String(code).trim().toUpperCase();
      return AIRPORT_BY_ICAO.get(c) || { icao: c, iata: null, city: null, name: c };
    }

    function airportCode(ap) {
      if (!ap) return '—';
      return ap.iata || ap.icao || '—';
    }

    function airportPlace(ap) {
      if (!ap) return '';
      return ap.city || ap.name || '';
    }

    // OpenSky live flight cache: hex → { at, route }
    const openSkyCache = new Map();
    const openSkyInflight = new Map();
    const OPENSKY_TTL_MS = 10 * 60 * 1000;

    async function fetchJson(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    // Try to read OpenSky despite CORS. Order:
    //  1) direct (works if OpenSky allows origin, or via local reverse proxy)
    //  2) allorigins get wrapper
    async function fetchOpenSkyFlights(hex) {
      const now = Math.floor(Date.now() / 1000);
      const begin = now - 12 * 3600; // last 12h covers long-haul departures
      const target = `https://opensky-network.org/api/flights/aircraft?icao24=${encodeURIComponent(hex)}&begin=${begin}&end=${now}`;

      // Optional user-provided CORS proxy (most reliable in-browser path)
      if (OPENSKY_PROXY) {
        try {
          const data = await fetchJson(OPENSKY_PROXY + encodeURIComponent(target));
          if (Array.isArray(data)) return data;
          // Some proxies wrap as { contents: "..." } or { data: [...] }
          if (Array.isArray(data?.data)) return data.data;
          if (typeof data?.contents === 'string') {
            const inner = JSON.parse(data.contents);
            if (Array.isArray(inner)) return inner;
          }
        } catch { /* fall through */ }
      }

      // Direct (works when CORS allows, e.g. same-origin reverse proxy)
      try {
        const data = await fetchJson(target);
        if (Array.isArray(data)) return data;
      } catch { /* CORS or network */ }

      // Public relay (best-effort; often rate-limited or down)
      try {
        const wrapped = 'https://api.allorigins.win/get?url=' + encodeURIComponent(target);
        const envelope = await fetchJson(wrapped);
        if (envelope && typeof envelope.contents === 'string') {
          const data = JSON.parse(envelope.contents);
          if (Array.isArray(data)) return data;
        }
      } catch { /* proxy down */ }

      return null; // unavailable from this origin
    }

    function pickLatestFlight(flights, callsign) {
      if (!Array.isArray(flights) || !flights.length) return null;
      const cs = (callsign || '').trim().toUpperCase();
      let list = flights.slice();
      if (cs) {
        const matched = list.filter(f => (f.callsign || '').trim().toUpperCase() === cs);
        if (matched.length) list = matched;
      }
      list.sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
      return list[0];
    }

    function linksForCallsign(callsign) {
      const icaoCs = (callsign || '').trim().toUpperCase().replace(/\s+/g, '');
      const iataCs = iataFlightNumber(icaoCs);
      const googleQ = encodeURIComponent((iataCs || icaoCs) + ' flight status');
      const faIdent = encodeURIComponent(icaoCs || iataCs);
      return {
        google: `https://www.google.com/search?q=${googleQ}`,
        flightaware: `https://www.flightaware.com/live/flight/${faIdent}`,
        label: iataCs || icaoCs || 'flight'
      };
    }

    // Resolve route ONLY from live OpenSky track data (or unknown + lookup links).
    // Never invent airports from stale schedule DBs.
    async function resolveRouteForAircraft(ac) {
      const hex = (ac.hex || '').toLowerCase();
      const cs = callsignKey(ac);
      const links = linksForCallsign(cs);

      if (!hex) {
        return {
          origin: null,
          dest: null,
          source: 'none',
          confidence: 'unknown',
          note: 'No ICAO hex — use lookup links',
          links
        };
      }

      const cached = openSkyCache.get(hex);
      if (cached && (Date.now() - cached.at) < OPENSKY_TTL_MS) {
        return { ...cached.route, links };
      }

      if (openSkyInflight.has(hex)) {
        const route = await openSkyInflight.get(hex);
        return { ...route, links };
      }

      const p = (async () => {
        const flights = await fetchOpenSkyFlights(hex);
        if (!flights) {
          return {
            origin: null,
            dest: null,
            source: 'opensky-blocked',
            confidence: 'unknown',
            note: 'Live airport data blocked in browser (CORS). Use Google / FlightAware for verified From → Landing.',
            links
          };
        }
        const fl = pickLatestFlight(flights, cs);
        if (!fl) {
          return {
            origin: null,
            dest: null,
            source: 'opensky',
            confidence: 'unknown',
            note: 'OpenSky has no recent flight for this airframe. Use lookup links.',
            links
          };
        }
        const origin = fl.estDepartureAirport ? lookupAirport(fl.estDepartureAirport) : null;
        const dest = fl.estArrivalAirport ? lookupAirport(fl.estArrivalAirport) : null;
        let note = 'From OpenSky live track (not a schedule DB)';
        if (origin && !dest) note = 'Departure from OpenSky live track · destination still unknown (en route)';
        if (!origin && dest) note = 'Arrival from OpenSky live track · departure unknown';
        if (!origin && !dest) note = 'OpenSky saw this flight but could not estimate airports yet';
        return {
          origin,
          dest,
          source: 'opensky',
          confidence: (origin || dest) ? 'live' : 'unknown',
          note,
          links,
          openSky: {
            firstSeen: fl.firstSeen,
            lastSeen: fl.lastSeen,
            depDist: fl.estDepartureAirportHorizDistance,
            arrDist: fl.estArrivalAirportHorizDistance
          }
        };
      })();

      openSkyInflight.set(hex, p);
      try {
        const route = await p;
        openSkyCache.set(hex, { at: Date.now(), route });
        return { ...route, links };
      } finally {
        openSkyInflight.delete(hex);
      }
    }

    async function ensureRoute(ac) {
      return resolveRouteForAircraft(ac);
    }

    // Only use cached live route when refreshing an open popup — never invent.
    function currentRouteFor(ac) {
      const hex = (ac?.hex || '').toLowerCase();
      if (!hex) return null;
      const cached = openSkyCache.get(hex);
      if (cached && (Date.now() - cached.at) < OPENSKY_TTL_MS) {
        const links = linksForCallsign(callsignKey(ac));
        return { ...cached.route, links };
      }
      return null; // popup open handler will load
    }

    function legHTML(kind, label, main, sub) {
      const subHtml = sub ? `<div class="ac-leg-sub">${esc(sub)}</div>` : '';
      return `<div class="ac-leg ac-leg-${kind}">
        <div class="ac-leg-label">${esc(label)}</div>
        <div class="ac-leg-main">${esc(main)}</div>
        ${subHtml}
      </div>`;
    }

    function routeCardHTML(fromMain, fromSub, toMain, toSub, note, links) {
      const noteHtml = note ? `<div class="ac-route-note">${esc(note)}</div>` : '';
      let linksHtml = '';
      if (links) {
        linksHtml = `<div class="ac-links">
          <a class="ac-link" href="${esc(links.google)}" target="_blank" rel="noopener noreferrer">Google status</a>
          <a class="ac-link" href="${esc(links.flightaware)}" target="_blank" rel="noopener noreferrer">FlightAware</a>
        </div>`;
      }
      return `<div class="ac-route">
        <div class="ac-legs">
          ${legHTML('from', 'From', fromMain, fromSub)}
          <div class="ac-leg-arrow" aria-hidden="true">→</div>
          ${legHTML('to', 'Landing', toMain, toSub)}
        </div>
        ${noteHtml}
        ${linksHtml}
      </div>`;
    }

    function popupHTML(ac, route) {
      const cs = (ac.flight || '').trim() || (ac.r || '').trim() || (ac.hex || '—').toUpperCase();
      const reg = (ac.r || '').trim();
      const typeCode = ac.t || '';
      const typeDesc = ac.desc || '';
      const typeLine = typeCode || typeDesc || '—';
      const operator = ac.ownOp || '';

      const altRaw = ac.alt_baro;
      const alt = altRaw != null && altRaw !== 'ground'
        ? `${Math.round(altRaw).toLocaleString()} ft`
        : (altRaw === 'ground' ? 'Ground' : '—');

      const vr = ac.baro_rate;
      let vrHtml = '';
      if (vr != null && isFinite(vr) && Math.abs(vr) >= 50) {
        const cls = vr > 0 ? 'ac-vr-up' : 'ac-vr-dn';
        const arrow = vr > 0 ? '↑' : '↓';
        vrHtml = `<span class="${cls} dim">${arrow} ${Math.abs(Math.round(vr)).toLocaleString()} fpm</span>`;
      }

      const speed = ac.gs != null ? `${Math.round(ac.gs)} kts` : '—';
      const track = ac.track != null ? `${Math.round(ac.track)}°` : '—';
      const trackComp = ac.track != null ? compass16(ac.track) : null;
      const trackStr = trackComp ? `${track}<span class="dim">${trackComp}</span>` : track;
      const squawk = ac.squawk || '—';

      const links = (route && route.links) || linksForCallsign(callsignKey(ac));

      let routeBlock;
      if (route === undefined) {
        routeBlock = `<div class="ac-route">
          <div class="ac-route-pending">Checking live From / Landing…</div>
          <div class="ac-links">
            <a class="ac-link" href="${esc(links.google)}" target="_blank" rel="noopener noreferrer">Google status</a>
            <a class="ac-link" href="${esc(links.flightaware)}" target="_blank" rel="noopener noreferrer">FlightAware</a>
          </div>
        </div>`;
      } else if (route && (route.origin || route.dest)) {
        const fromMain = route.origin ? airportCode(route.origin) : '—';
        const fromSub = route.origin ? (airportPlace(route.origin) || '') : 'Unknown';
        const toMain = route.dest ? airportCode(route.dest) : '—';
        const toSub = route.dest ? (airportPlace(route.dest) || '') : (route.origin ? 'En route / unknown' : 'Unknown');
        routeBlock = routeCardHTML(fromMain, fromSub, toMain, toSub, route.note, links);
      } else {
        // No invented airports — honest empty state + verified lookup links
        routeBlock = routeCardHTML(
          '—',
          'Not from live track',
          '—',
          'Not from live track',
          (route && route.note) || 'Airport codes not available from live track. Use Google / FlightAware for verified From → Landing (same as double-checking the flight number).',
          links
        );
      }

      const subParts = [];
      if (operator) subParts.push(esc(operator));
      if (reg) subParts.push(esc(reg));
      if (typeDesc && typeCode) subParts.push(esc(typeDesc));
      const sub = subParts.join(' · ') || '—';

      let foot = '';
      if (ac.dst != null && isFinite(ac.dst)) {
        const bearing = ac.dir != null ? compass16(ac.dir) : null;
        foot = `<div class="ac-foot">${ac.dst.toFixed(0)} nm${bearing ? ' ' + bearing : ''} of Seattle</div>`;
      }

      return `<div class="ac-popup">
        <div class="ac-head">
          <span class="ac-cs">${esc(cs)}</span>
          <span class="ac-type">${esc(typeLine)}</span>
        </div>
        <div class="ac-sub">${sub}</div>
        ${routeBlock}
        <div class="ac-grid">
          <span class="k">Alt</span><span class="v">${esc(alt)}${vrHtml}</span>
          <span class="k">Spd</span><span class="v">${esc(speed)}</span>
          <span class="k">Hdg</span><span class="v">${trackStr}</span>
          <span class="k">Sqk</span><span class="v">${esc(squawk)}</span>
        </div>
        ${foot}
      </div>`;
    }

    function popupOptions() {
      return { maxWidth: 300, minWidth: 220, className: 'ac-popup-wrap', autoPanPadding: [60, 60] };
    }

    function wirePopupRoute(marker, id) {
      marker.on('popupopen', async () => {
        const p = aircraft[id];
        if (!p?.ac) return;
        // Show loading + links immediately (links always work)
        marker.setPopupContent(popupHTML(p.ac, undefined));
        try {
          const route = await ensureRoute(p.ac);
          if (aircraft[id] && marker.isPopupOpen()) {
            marker.setPopupContent(popupHTML(aircraft[id].ac, route));
          }
        } catch (e) {
          console.warn('route lookup failed', e);
          if (aircraft[id] && marker.isPopupOpen()) {
            marker.setPopupContent(popupHTML(aircraft[id].ac, {
              origin: null,
              dest: null,
              note: 'Route lookup failed. Use Google / FlightAware links.',
              links: linksForCallsign(callsignKey(aircraft[id].ac)),
              confidence: 'unknown',
              source: 'error'
            }));
          }
        }
      });
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // Move lat/lon along track (deg) by ground speed (knots) for dtMs milliseconds
    function deadReckon(lat, lon, trackDeg, gsKnots, dtMs) {
      if (lat == null || lon == null || trackDeg == null || gsKnots == null || !(gsKnots > 0) || dtMs <= 0) {
        return { lat, lon };
      }
      // nm traveled; 1 nm ≈ 1/60 deg latitude
      const nm = (gsKnots * dtMs) / 3_600_000;
      const rad = trackDeg * Math.PI / 180;
      const dLat = (nm * Math.cos(rad)) / 60;
      const cosLat = Math.cos(lat * Math.PI / 180);
      const dLon = cosLat === 0 ? 0 : (nm * Math.sin(rad)) / (60 * cosLat);
      return { lat: lat + dLat, lon: lon + dLon };
    }

    // Predicted position at "now" from last ADS-B fix (optionally aged by seen_pos)
    function predictedFromFix(ac, nowMs) {
      let ageMs = 0;
      if (ac.seen_pos != null && isFinite(ac.seen_pos)) {
        ageMs = Math.max(0, ac.seen_pos * 1000);
      }
      // Also project forward a short blend so the target is where the plane will be
      // when the ease-out finishes (reduces stop-and-go feel)
      ageMs += ANIMATION_MS * 0.35;
      return deadReckon(ac.lat, ac.lon, ac.track, ac.gs, ageMs);
    }

    // Animation loop – blend to new fixes, then keep coasting via dead reckoning
    function animate() {
      const now = performance.now();

      Object.values(aircraft).forEach(plane => {
        if (plane.animStart) {
          const elapsed = now - plane.animStart;
          let t = Math.min(elapsed / ANIMATION_MS, 1);
          // Ease-out cubic
          t = 1 - Math.pow(1 - t, 3);

          const lat = lerp(plane.startLat, plane.targetLat, t);
          const lon = lerp(plane.startLon, plane.targetLon, t);

          plane.marker.setLatLng([lat, lon]);
          plane.lat = lat;
          plane.lon = lon;

          if (t >= 1) {
            plane.animStart = null;
            // Anchor dead reckoning from settled position
            plane.fixLat = lat;
            plane.fixLon = lon;
            plane.fixTime = now;
          }
          return;
        }

        // Between API updates: coast using last ground speed + track
        if (plane.gs != null && plane.track != null && plane.fixTime != null) {
          const pred = deadReckon(plane.fixLat, plane.fixLon, plane.track, plane.gs, now - plane.fixTime);
          plane.marker.setLatLng([pred.lat, pred.lon]);
          plane.lat = pred.lat;
          plane.lon = pred.lon;
        }
      });

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    async function fetchFlights() {
      const url = `https://api.airplanes.live/v2/point/${HOME.lat}/${HOME.lon}/${RADIUS_NM}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        const list = data.ac || [];
        const seen = new Set();
        const now = performance.now();

        list.forEach(ac => {
          if (ac.lat == null || ac.lon == null) return;
          const id = ac.hex || (ac.flight + '_' + Math.round(ac.lat * 1000));

          seen.add(id);
          const pred = predictedFromFix(ac, now);

          if (aircraft[id]) {
            const p = aircraft[id];
            const heading = resolveHeading(ac, p.lat, p.lon, pred.lat, pred.lon, p.track);
            p.startLat = p.lat;
            p.startLon = p.lon;
            p.targetLat = pred.lat;
            p.targetLon = pred.lon;
            p.animStart = now;
            p.gs = ac.gs;
            p.ac = ac;
            // fix* re-anchored when blend completes (see animate)
            p.fixLat = pred.lat;
            p.fixLon = pred.lon;
            p.fixTime = now;

            applyPlaneVisual(p, heading, ac.alt_baro);
            const route = currentRouteFor(ac);
            p.marker.setPopupContent(popupHTML(ac, route));
          } else {
            const heading = resolveHeading(ac, null, null, pred.lat, pred.lon, null);
            const route = currentRouteFor(ac);
            const marker = L.marker([pred.lat, pred.lon], {
              icon: planeIcon(heading, ac.alt_baro)
            }).bindPopup(popupHTML(ac, route), popupOptions()).addTo(map);

            wirePopupRoute(marker, id);

            aircraft[id] = {
              marker,
              ac,
              lat: pred.lat,
              lon: pred.lon,
              track: heading,
              alt: ac.alt_baro,
              gs: ac.gs,
              fixLat: pred.lat,
              fixLon: pred.lon,
              fixTime: now,
              targetLat: pred.lat,
              targetLon: pred.lon,
              startLat: pred.lat,
              startLon: pred.lon,
              animStart: null
            };
          }
        });

        Object.keys(aircraft).forEach(id => {
          if (!seen.has(id)) {
            map.removeLayer(aircraft[id].marker);
            delete aircraft[id];
          }
        });

        document.getElementById('count').textContent = list.length;
        document.getElementById('status').textContent =
          new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (err) {
        console.error(err);
        document.getElementById('status').textContent = 'Error – retrying…';
      }
    }

    // Start
    fetchFlights();
    setInterval(fetchFlights, REFRESH_MS);
  </script>
</body>
</html>
