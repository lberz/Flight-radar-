<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a1a">
  <title>Leo's Flight Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0a0a1a; font-family: -apple-system, system-ui, sans-serif; }
    #map { width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: rgba(10,10,26,0.88); color: #8cf;
      padding: 10px 14px; border-radius: 12px;
      font-size: 13px; backdrop-filter: blur(8px);
      border: 1px solid rgba(100,180,255,0.25);
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    #hud b { color: #fff; }
    .plane-icon {
      font-size: 20px;
      text-shadow: 0 0 6px currentColor;
      line-height: 1;
      text-align: center;
      transition: transform 0.4s ease;
    }
    .leaflet-popup-content-wrapper {
      background: #111827; color: #e5e7eb; border-radius: 10px;
      border: 1px solid #374151;
    }
    .leaflet-popup-tip { background: #111827; }
    .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.45; }
    .leaflet-control-zoom { border: none !important; }
    .leaflet-control-zoom a {
      background: rgba(10,10,26,0.9) !important; color: #8cf !important;
      border: 1px solid rgba(100,180,255,0.3) !important;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span>✈ <b id="count">—</b></span>
    <span id="status">Loading…</span>
  </div>
  <div id="map"></div>

  <script>
    // ===== CONFIG =====
    const HOME = { lat: 47.6062, lon: -122.3321 };   // Seattle
    const RADIUS_NM = 100;
    const REFRESH_MS = 8000;        // Faster refresh (8 seconds)
    const ANIMATION_MS = 2200;      // How long the glide animation takes

    // ===== MAP =====
    const map = L.map('map', {
      center: [HOME.lat, HOME.lon],
      zoom: 9,
      zoomControl: false,
      attributionControl: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO | Data: airplanes.live',
      maxZoom: 18
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.circleMarker([HOME.lat, HOME.lon], {
      radius: 6, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.8, weight: 2
    }).addTo(map).bindPopup('Home (Seattle)');

    // ===== STATE =====
    const aircraft = {};   // id → { marker, lat, lon, track, alt, targetLat, targetLon, startLat, startLon, animStart }

    function planeIcon(track, alt) {
      let color = '#9ca3af';
      if (alt != null) {
        if (alt < 5000) color = '#22c55e';
        else if (alt < 15000) color = '#eab308';
        else if (alt < 30000) color = '#f97316';
        else color = '#ef4444';
      }
      return L.divIcon({
        className: '',
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        html: `<div class="plane-icon" style="color:${color}; transform:rotate(${track || 0}deg)">✈</div>`
      });
    }

    function popupHTML(ac) {
      const callsign = (ac.flight || ac.r || ac.hex || '—').trim();
      const alt = ac.alt_baro != null ? Math.round(ac.alt_baro).toLocaleString() + ' ft' : '—';
      const speed = ac.gs != null ? Math.round(ac.gs) + ' kts' : '—';
      const track = ac.track != null ? Math.round(ac.track) + '°' : '—';
      const type = ac.t || ac.desc || '—';
      return `
        <b style="font-size:15px">${callsign}</b><br>
        Type: ${type}<br>
        Alt: ${alt}<br>
        Speed: ${speed}<br>
        Track: ${track}<br>
        Hex: ${ac.hex || '—'}
      `;
    }

    // Smooth interpolation helper
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // Animation loop – runs continuously
    function animate() {
      const now = performance.now();

      Object.values(aircraft).forEach(plane => {
        if (!plane.animStart) return;

        const elapsed = now - plane.animStart;
        let t = Math.min(elapsed / ANIMATION_MS, 1);

        // Ease-out cubic for nicer feel
        t = 1 - Math.pow(1 - t, 3);

        const lat = lerp(plane.startLat, plane.targetLat, t);
        const lon = lerp(plane.startLon, plane.targetLon, t);

        plane.marker.setLatLng([lat, lon]);
        plane.lat = lat;
        plane.lon = lon;

        if (t >= 1) {
          plane.animStart = null; // animation finished
        }
      });

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    async function fetchFlights() {
      const url = `https://api.airplanes.live/v2/point/${HOME.lat}/${HOME.lon}/${RADIUS_NM}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        const list = data.ac || [];
        const seen = new Set();

        list.forEach(ac => {
          if (ac.lat == null || ac.lon == null) return;
          const id = ac.hex || (ac.flight + '_' + Math.round(ac.lat * 1000));

          seen.add(id);

          if (aircraft[id]) {
            // Existing plane → start smooth move to new position
            const p = aircraft[id];
            p.startLat = p.lat;
            p.startLon = p.lon;
            p.targetLat = ac.lat;
            p.targetLon = ac.lon;
            p.animStart = performance.now();
            p.track = ac.track;
            p.alt = ac.alt_baro;

            // Update icon (heading + color) immediately
            p.marker.setIcon(planeIcon(ac.track, ac.alt_baro));
            p.marker.setPopupContent(popupHTML(ac));
          } else {
            // Brand new plane
            const marker = L.marker([ac.lat, ac.lon], {
              icon: planeIcon(ac.track, ac.alt_baro)
            }).bindPopup(popupHTML(ac)).addTo(map);

            aircraft[id] = {
              marker,
              lat: ac.lat,
              lon: ac.lon,
              track: ac.track,
              alt: ac.alt_baro,
              targetLat: ac.lat,
              targetLon: ac.lon,
              startLat: ac.lat,
              startLon: ac.lon,
              animStart: null
            };
          }
        });

        // Remove planes that disappeared
        Object.keys(aircraft).forEach(id => {
          if (!seen.has(id)) {
            map.removeLayer(aircraft[id].marker);
            delete aircraft[id];
          }
        });

        document.getElementById('count').textContent = list.length;
        document.getElementById('status').textContent =
          new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (err) {
        console.error(err);
        document.getElementById('status').textContent = 'Error – retrying…';
      }
    }

    // Start
    fetchFlights();
    setInterval(fetchFlights, REFRESH_MS);
  </script>
</body>
</html>
