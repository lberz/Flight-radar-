<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a1a">
  <title>Leo's Flight Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0a0a1a; font-family: -apple-system, system-ui, sans-serif; }
    #map { width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: rgba(10,10,26,0.88); color: #8cf;
      padding: 10px 14px; border-radius: 12px;
      font-size: 13px; backdrop-filter: blur(8px);
      border: 1px solid rgba(100,180,255,0.25);
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    #hud b { color: #fff; }
    /* Transparent host so only the SVG plane shows */
    .plane-marker {
      background: transparent !important;
      border: none !important;
    }
    .plane-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 4px currentColor);
      /* Nose-up SVG; rotate() is applied so 0° = north / track heading */
      transform-origin: center center;
      transition: transform 0.35s ease-out;
      will-change: transform;
    }
    .plane-icon svg {
      display: block;
      width: 26px;
      height: 26px;
      overflow: visible;
    }
    .leaflet-popup-content-wrapper {
      background: #0f172a; color: #e5e7eb; border-radius: 12px;
      border: 1px solid rgba(100,180,255,0.28);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
    .leaflet-popup-tip { background: #0f172a; }
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.4; }
    .leaflet-popup-close-button { color: #8cf !important; top: 6px !important; right: 8px !important; }
    .leaflet-control-zoom { border: none !important; }
    .leaflet-control-zoom a {
      background: rgba(10,10,26,0.9) !important; color: #8cf !important;
      border: 1px solid rgba(100,180,255,0.3) !important;
    }

    /* Aircraft popup layout */
    .ac-popup { min-width: 210px; max-width: 270px; }
    .ac-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 10px; padding-right: 14px; margin-bottom: 2px;
    }
    .ac-cs {
      font-size: 16px; font-weight: 700; color: #fff;
      letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
    }
    .ac-type {
      font-size: 11px; color: #7dd3fc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }
    .ac-sub { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
    .ac-route {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(100, 180, 255, 0.22);
      border-radius: 9px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .ac-route-pending { font-size: 12px; color: #64748b; font-style: italic; }
    .ac-legs {
      display: grid;
      grid-template-columns: 1fr 18px 1fr;
      gap: 4px 6px;
      align-items: start;
    }
    .ac-leg-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #64748b; margin-bottom: 3px;
    }
    .ac-leg-main {
      font-size: 15px; font-weight: 700; color: #f8fafc;
      font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
      line-height: 1.15;
    }
    .ac-leg-from .ac-leg-main { color: #c4b5fd; }
    .ac-leg-to .ac-leg-main { color: #7dd3fc; }
    .ac-leg-sub {
      font-size: 11px; color: #94a3b8; margin-top: 3px; line-height: 1.3;
      word-break: break-word;
    }
    .ac-leg-arrow {
      color: #38bdf8; font-size: 15px; font-weight: 600;
      text-align: center; padding-top: 18px; line-height: 1;
    }
    .ac-route-note {
      margin-top: 8px; font-size: 10px; color: #64748b; line-height: 1.3;
    }
    .ac-grid {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 4px 10px;
      font-size: 12px;
    }
    .ac-grid .k { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 1px; }
    .ac-grid .v { color: #e2e8f0; font-variant-numeric: tabular-nums; }
    .ac-grid .v .dim { color: #94a3b8; font-size: 11px; margin-left: 4px; }
    .ac-vr-up { color: #4ade80; }
    .ac-vr-dn { color: #fb923c; }
    .ac-foot {
      margin-top: 10px; padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      font-size: 11px; color: #64748b;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span>✈ <b id="count">—</b></span>
    <span id="status">Loading…</span>
  </div>
  <div id="map"></div>

  <script>
    // ===== CONFIG =====
    const HOME = { lat: 47.6062, lon: -122.3321 };   // Seattle
    const RADIUS_NM = 100;
    const REFRESH_MS = 5000;        // Poll every 5s (was 8s)
    const ANIMATION_MS = 1200;      // Blend duration when a new API fix arrives
    // Dead-reckon between polls using ground speed + track so icons keep moving

    // ===== MAP =====
    const map = L.map('map', {
      center: [HOME.lat, HOME.lon],
      zoom: 9,
      zoomControl: false,
      attributionControl: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO | Data: airplanes.live',
      maxZoom: 18
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.circleMarker([HOME.lat, HOME.lon], {
      radius: 6, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.8, weight: 2
    }).addTo(map).bindPopup('Home (Seattle)');

    // ===== STATE =====
    // id → { marker, lat, lon, track, alt, gs, fixLat, fixLon, fixTime,
    //         startLat, startLon, targetLat, targetLon, animStart }
    const aircraft = {};

    // Nose points UP (north) at 0°. CSS rotate(track) then matches ADS-B track
    // (0° = north, 90° = east). The old ✈ glyph faces ~NE, so bare track looked wrong.
    function planeIcon(track, alt) {
      let color = '#9ca3af';
      if (alt != null) {
        if (alt < 5000) color = '#22c55e';
        else if (alt < 15000) color = '#eab308';
        else if (alt < 30000) color = '#f97316';
        else color = '#ef4444';
      }
      const heading = (track != null && isFinite(track)) ? track : 0;
      return L.divIcon({
        className: 'plane-marker',
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        html: `<div class="plane-icon" style="color:${color};transform:rotate(${heading}deg)">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <!-- Simple aircraft silhouette; nose at top (north) -->
            <path fill="currentColor" d="M12 2 L14.8 10.2 L22 12 L14.8 13.2 L13.2 22 L12 18.6 L10.8 22 L9.2 13.2 L2 12 L9.2 10.2 Z"/>
          </svg>
        </div>`
      });
    }

    // Geographic bearing (deg clockwise from north) from point A → B
    function bearingDeg(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // Prefer ADS-B track; if missing, infer from movement so the nose still leads
    function resolveHeading(ac, fromLat, fromLon, toLat, toLon, fallback) {
      if (ac.track != null && isFinite(ac.track)) return ac.track;
      if (
        fromLat != null && fromLon != null && toLat != null && toLon != null &&
        (Math.abs(toLat - fromLat) > 1e-7 || Math.abs(toLon - fromLon) > 1e-7)
      ) {
        return bearingDeg(fromLat, fromLon, toLat, toLon);
      }
      return (fallback != null && isFinite(fallback)) ? fallback : 0;
    }

    // Update rotation/color without always rebuilding the icon when possible
    function applyPlaneVisual(plane, heading, alt) {
      plane.track = heading;
      plane.alt = alt;
      const el = plane.marker.getElement()?.querySelector('.plane-icon');
      if (el) {
        el.style.transform = `rotate(${heading}deg)`;
        let color = '#9ca3af';
        if (alt != null) {
          if (alt < 5000) color = '#22c55e';
          else if (alt < 15000) color = '#eab308';
          else if (alt < 30000) color = '#f97316';
          else color = '#ef4444';
        }
        el.style.color = color;
      } else {
        plane.marker.setIcon(planeIcon(heading, alt));
      }
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function compass16(deg) {
      if (deg == null || !isFinite(deg)) return null;
      const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
      return dirs[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
    }

    // Resolved routes from free adsbdb callsign lookup (origin / destination)
    const routeResolved = new Map(); // CALLSIGN → route|null
    const routeInflight = new Map(); // CALLSIGN → Promise

    function callsignKey(ac) {
      return (ac.flight || '').trim().toUpperCase();
    }

    async function ensureRoute(callsign) {
      const cs = (callsign || '').trim().toUpperCase();
      if (!cs || cs.length < 2) return null;
      if (routeResolved.has(cs)) return routeResolved.get(cs);
      if (routeInflight.has(cs)) return routeInflight.get(cs);

      const p = (async () => {
        try {
          const res = await fetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(cs)}`);
          if (!res.ok) {
            routeResolved.set(cs, null);
            return null;
          }
          const data = await res.json();
          const fr = data?.response?.flightroute;
          if (!fr || (!fr.origin && !fr.destination)) {
            routeResolved.set(cs, null);
            return null;
          }
          const pack = (ap) => ap ? {
            iata: ap.iata_code || null,
            icao: ap.icao_code || null,
            city: ap.municipality || null,
            name: ap.name || null
          } : null;
          const route = {
            airline: fr.airline?.name || null,
            origin: pack(fr.origin),
            dest: pack(fr.destination)
          };
          routeResolved.set(cs, route);
          return route;
        } catch {
          routeResolved.set(cs, null);
          return null;
        } finally {
          routeInflight.delete(cs);
        }
      })();

      routeInflight.set(cs, p);
      return p;
    }

    function airportCode(ap) {
      if (!ap) return '—';
      return ap.iata || ap.icao || '—';
    }

    function airportPlace(ap) {
      if (!ap) return '';
      return ap.city || ap.name || '';
    }

    // One side of the From / Landing pair
    function legHTML(kind, label, main, sub, noteClass) {
      const subHtml = sub ? `<div class="ac-leg-sub">${esc(sub)}</div>` : '';
      return `<div class="ac-leg ac-leg-${kind}${noteClass ? ' ' + noteClass : ''}">
        <div class="ac-leg-label">${esc(label)}</div>
        <div class="ac-leg-main">${esc(main)}</div>
        ${subHtml}
      </div>`;
    }

    function routeCardHTML(fromMain, fromSub, toMain, toSub, note) {
      const noteHtml = note ? `<div class="ac-route-note">${esc(note)}</div>` : '';
      return `<div class="ac-route">
        <div class="ac-legs">
          ${legHTML('from', 'From', fromMain, fromSub)}
          <div class="ac-leg-arrow" aria-hidden="true">→</div>
          ${legHTML('to', 'Landing', toMain, toSub)}
        </div>
        ${noteHtml}
      </div>`;
    }

    // route: undefined = still loading / not requested; null = unknown; object = known
    function popupHTML(ac, route) {
      const cs = (ac.flight || '').trim() || (ac.r || '').trim() || (ac.hex || '—').toUpperCase();
      const reg = (ac.r || '').trim();
      const typeCode = ac.t || '';
      const typeDesc = ac.desc || '';
      const typeLine = typeCode || typeDesc || '—';
      const operator = ac.ownOp || (route && route.airline) || '';

      const altRaw = ac.alt_baro;
      const alt = altRaw != null && altRaw !== 'ground'
        ? `${Math.round(altRaw).toLocaleString()} ft`
        : (altRaw === 'ground' ? 'Ground' : '—');

      const vr = ac.baro_rate;
      let vrHtml = '';
      if (vr != null && isFinite(vr) && Math.abs(vr) >= 50) {
        const cls = vr > 0 ? 'ac-vr-up' : 'ac-vr-dn';
        const arrow = vr > 0 ? '↑' : '↓';
        vrHtml = `<span class="${cls} dim">${arrow} ${Math.abs(Math.round(vr)).toLocaleString()} fpm</span>`;
      }

      const speed = ac.gs != null ? `${Math.round(ac.gs)} kts` : '—';
      const track = ac.track != null ? `${Math.round(ac.track)}°` : '—';
      const trackComp = ac.track != null ? compass16(ac.track) : null;
      const trackStr = trackComp ? `${track}<span class="dim">${trackComp}</span>` : track;
      const squawk = ac.squawk || '—';

      let routeBlock;
      if (route === undefined) {
        routeBlock = `<div class="ac-route"><div class="ac-route-pending">Looking up from / landing…</div></div>`;
      } else if (route && (route.origin || route.dest)) {
        // Scheduled origin + destination (landing airport)
        const fromMain = route.origin ? airportCode(route.origin) : '—';
        const fromSub = route.origin ? airportPlace(route.origin) : 'Origin unknown';
        const toMain = route.dest ? airportCode(route.dest) : '—';
        const toSub = route.dest ? airportPlace(route.dest) : 'Destination unknown';
        routeBlock = routeCardHTML(fromMain, fromSub, toMain, toSub, null);
      } else {
        // No schedule: approximate direction of origin vs travel / landing direction
        const fromComp = ac.track != null ? compass16(ac.track + 180) : null;
        const toComp = ac.track != null ? compass16(ac.track) : null;
        if (fromComp || toComp) {
          routeBlock = routeCardHTML(
            fromComp || '—',
            fromComp ? 'Direction of origin' : '',
            toComp || '—',
            toComp ? 'Heading / toward landing' : '',
            'Schedule not found — showing track-based directions'
          );
        } else {
          routeBlock = `<div class="ac-route"><div class="ac-route-pending">From / landing unavailable</div></div>`;
        }
      }

      const subParts = [];
      if (operator) subParts.push(esc(operator));
      if (reg) subParts.push(esc(reg));
      if (typeDesc && typeCode) subParts.push(esc(typeDesc));
      const sub = subParts.join(' · ') || '—';

      let foot = '';
      if (ac.dst != null && isFinite(ac.dst)) {
        const bearing = ac.dir != null ? compass16(ac.dir) : null;
        foot = `<div class="ac-foot">${ac.dst.toFixed(0)} nm${bearing ? ' ' + bearing : ''} of Seattle</div>`;
      }

      return `<div class="ac-popup">
        <div class="ac-head">
          <span class="ac-cs">${esc(cs)}</span>
          <span class="ac-type">${esc(typeLine)}</span>
        </div>
        <div class="ac-sub">${sub}</div>
        ${routeBlock}
        <div class="ac-grid">
          <span class="k">Alt</span><span class="v">${esc(alt)}${vrHtml}</span>
          <span class="k">Spd</span><span class="v">${esc(speed)}</span>
          <span class="k">Hdg</span><span class="v">${trackStr}</span>
          <span class="k">Sqk</span><span class="v">${esc(squawk)}</span>
        </div>
        ${foot}
      </div>`;
    }

    function popupOptions() {
      return { maxWidth: 300, minWidth: 220, className: 'ac-popup-wrap', autoPanPadding: [60, 60] };
    }

    // Live-update route section when popup is open
    function wirePopupRoute(marker, id) {
      marker.on('popupopen', async () => {
        const p = aircraft[id];
        if (!p?.ac) return;
        const cs = callsignKey(p.ac);
        if (!cs) {
          marker.setPopupContent(popupHTML(p.ac, null));
          return;
        }
        if (routeResolved.has(cs)) {
          marker.setPopupContent(popupHTML(p.ac, routeResolved.get(cs)));
        } else {
          marker.setPopupContent(popupHTML(p.ac, undefined));
        }
        const route = await ensureRoute(cs);
        if (aircraft[id] && marker.isPopupOpen()) {
          marker.setPopupContent(popupHTML(aircraft[id].ac, route));
        }
      });
    }

    function currentRouteFor(ac) {
      const cs = callsignKey(ac);
      if (!cs) return null;
      if (routeResolved.has(cs)) return routeResolved.get(cs);
      // Kick off lookup in background for next open / next refresh
      ensureRoute(cs);
      return undefined;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // Move lat/lon along track (deg) by ground speed (knots) for dtMs milliseconds
    function deadReckon(lat, lon, trackDeg, gsKnots, dtMs) {
      if (lat == null || lon == null || trackDeg == null || gsKnots == null || !(gsKnots > 0) || dtMs <= 0) {
        return { lat, lon };
      }
      // nm traveled; 1 nm ≈ 1/60 deg latitude
      const nm = (gsKnots * dtMs) / 3_600_000;
      const rad = trackDeg * Math.PI / 180;
      const dLat = (nm * Math.cos(rad)) / 60;
      const cosLat = Math.cos(lat * Math.PI / 180);
      const dLon = cosLat === 0 ? 0 : (nm * Math.sin(rad)) / (60 * cosLat);
      return { lat: lat + dLat, lon: lon + dLon };
    }

    // Predicted position at "now" from last ADS-B fix (optionally aged by seen_pos)
    function predictedFromFix(ac, nowMs) {
      let ageMs = 0;
      if (ac.seen_pos != null && isFinite(ac.seen_pos)) {
        ageMs = Math.max(0, ac.seen_pos * 1000);
      }
      // Also project forward a short blend so the target is where the plane will be
      // when the ease-out finishes (reduces stop-and-go feel)
      ageMs += ANIMATION_MS * 0.35;
      return deadReckon(ac.lat, ac.lon, ac.track, ac.gs, ageMs);
    }

    // Animation loop – blend to new fixes, then keep coasting via dead reckoning
    function animate() {
      const now = performance.now();

      Object.values(aircraft).forEach(plane => {
        if (plane.animStart) {
          const elapsed = now - plane.animStart;
          let t = Math.min(elapsed / ANIMATION_MS, 1);
          // Ease-out cubic
          t = 1 - Math.pow(1 - t, 3);

          const lat = lerp(plane.startLat, plane.targetLat, t);
          const lon = lerp(plane.startLon, plane.targetLon, t);

          plane.marker.setLatLng([lat, lon]);
          plane.lat = lat;
          plane.lon = lon;

          if (t >= 1) {
            plane.animStart = null;
            // Anchor dead reckoning from settled position
            plane.fixLat = lat;
            plane.fixLon = lon;
            plane.fixTime = now;
          }
          return;
        }

        // Between API updates: coast using last ground speed + track
        if (plane.gs != null && plane.track != null && plane.fixTime != null) {
          const pred = deadReckon(plane.fixLat, plane.fixLon, plane.track, plane.gs, now - plane.fixTime);
          plane.marker.setLatLng([pred.lat, pred.lon]);
          plane.lat = pred.lat;
          plane.lon = pred.lon;
        }
      });

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    async function fetchFlights() {
      const url = `https://api.airplanes.live/v2/point/${HOME.lat}/${HOME.lon}/${RADIUS_NM}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        const list = data.ac || [];
        const seen = new Set();
        const now = performance.now();

        list.forEach(ac => {
          if (ac.lat == null || ac.lon == null) return;
          const id = ac.hex || (ac.flight + '_' + Math.round(ac.lat * 1000));

          seen.add(id);
          const pred = predictedFromFix(ac, now);

          if (aircraft[id]) {
            const p = aircraft[id];
            const heading = resolveHeading(ac, p.lat, p.lon, pred.lat, pred.lon, p.track);
            p.startLat = p.lat;
            p.startLon = p.lon;
            p.targetLat = pred.lat;
            p.targetLon = pred.lon;
            p.animStart = now;
            p.gs = ac.gs;
            p.ac = ac;
            // fix* re-anchored when blend completes (see animate)
            p.fixLat = pred.lat;
            p.fixLon = pred.lon;
            p.fixTime = now;

            applyPlaneVisual(p, heading, ac.alt_baro);
            const route = currentRouteFor(ac);
            p.marker.setPopupContent(popupHTML(ac, route));
          } else {
            const heading = resolveHeading(ac, null, null, pred.lat, pred.lon, null);
            const route = currentRouteFor(ac);
            const marker = L.marker([pred.lat, pred.lon], {
              icon: planeIcon(heading, ac.alt_baro)
            }).bindPopup(popupHTML(ac, route), popupOptions()).addTo(map);

            wirePopupRoute(marker, id);

            aircraft[id] = {
              marker,
              ac,
              lat: pred.lat,
              lon: pred.lon,
              track: heading,
              alt: ac.alt_baro,
              gs: ac.gs,
              fixLat: pred.lat,
              fixLon: pred.lon,
              fixTime: now,
              targetLat: pred.lat,
              targetLon: pred.lon,
              startLat: pred.lat,
              startLon: pred.lon,
              animStart: null
            };
          }
        });

        Object.keys(aircraft).forEach(id => {
          if (!seen.has(id)) {
            map.removeLayer(aircraft[id].marker);
            delete aircraft[id];
          }
        });

        document.getElementById('count').textContent = list.length;
        document.getElementById('status').textContent =
          new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (err) {
        console.error(err);
        document.getElementById('status').textContent = 'Error – retrying…';
      }
    }

    // Start
    fetchFlights();
    setInterval(fetchFlights, REFRESH_MS);
  </script>
</body>
</html>
